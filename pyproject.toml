[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nes-data-converter"
version = "0.2.0"
description = "Offline Instinct conversion with explicitly selected historical NES candidate modes"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
nes-converter = "nes_converter.__main__:main"

[tool.setuptools.packages.find]
include = ["nes_converter*"]

[tool.setuptools.package-data]
"nes_converter.prompt" = ["template.json"]
"nes_converter.validation" = ["*.cjs"]
